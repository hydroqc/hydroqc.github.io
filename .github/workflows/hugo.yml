name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Publishing now goes through the gh-pages branch (required so PR previews can
# be served from /pr-preview/ on the same Pages site).
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.166.0
  HUGO_ENVIRONMENT: production

jobs:
  # Build and deploy job
  build-and-deploy:
    environment:
      name: github-pages
      url: https://hydroqc.ca
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Install Dart Sass 1.106.1
        run: |
          curl -fsSLo "$RUNNER_TEMP/dart-sass.tar.gz" \
            https://github.com/sass/dart-sass/releases/download/1.106.1/dart-sass-1.106.1-linux-x64.tar.gz
          sudo tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C /opt
          sudo ln -sf /opt/dart-sass/sass /usr/local/bin/sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download Hugo modules
        run: hugo mod get
      - name: Generate npm dependencies for Hugo modules
        run: hugo mod npm pack
      - name: Install Node.js dependencies
        run: npm install
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo \
            --minify \
            --baseURL "https://hydroqc.ca/"
      # keep_files/clean-exclude + force:false so existing PR previews survive
      # a production deployment, and new commits are rebased rather than
      # force-pushed over them.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./public
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview/
          # Rebase instead of force-pushing so a concurrent preview deployment
          # is never silently overwritten.
          force: false
